services:
  deepseek-harness:
    build: .
    container_name: deepseek-harness
    restart: unless-stopped
    stdin_open: true
    tty: true
    network_mode: host
    environment:
      - DSH_TELEMETRY_DISABLED=1
      - DSH_TRUSTED_HOST=${DSH_TRUSTED_HOST:-}
      - DSH_PUBLIC_URL=${DSH_PUBLIC_URL:-}
    volumes:
      - dsh-config:/home/node/.dsh
      - ./workspace:/workspace:rw

volumes:
  dsh-config:
